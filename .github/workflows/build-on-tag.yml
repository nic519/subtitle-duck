name: Build App On Tag

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify project
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run typecheck and web build
        run: bun run build

  prepare-release:
    name: Create draft GitHub release
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true

  build-macos:
    name: Build macOS arm64
    needs:
      - verify
      - prepare-release
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS package
        run: bun run package

      - name: Collect macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          dmg="$(find artifacts -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "No macOS DMG found in artifacts."
            find artifacts -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$dmg" release-assets/
          ls -lah release-assets

      - name: Upload macOS asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true

  build-windows:
    name: Build Windows x64
    needs:
      - verify
      - prepare-release
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Electrobun Windows package
        run: bun run package

      - name: Prepare Windows installer payload
        run: bun scripts/prepare-windows-payload.ts

      - name: Build native Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $outputDir = (Resolve-Path artifacts).Path
          $sourceDir = (Get-Content portable-work\source-dir.txt -Raw).Trim()
          & $iscc `
            "/DAppVersion=$version" `
            "/O$outputDir" `
            "/Fsubtitle-duck_${version}_x64-setup" `
            "/DAppIconFile=$((Resolve-Path assets\app-icon.ico).Path)" `
            "/DSourceDir=$sourceDir" `
            scripts\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Collect Windows release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-Item artifacts\subtitle-duck_*_x64-setup.exe | Select-Object -First 1
          if (-not $installer) {
            Get-ChildItem artifacts -Force | Format-Table Name,Length
            throw "Windows installer exe not found."
          }
          Copy-Item $installer.FullName release-assets\
          Get-ChildItem release-assets -Force | Format-Table Name,Length

      - name: Smoke test native installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-Item artifacts\subtitle-duck_*_x64-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "subtitle-duck-smoke-install"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $installProcess = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir", "/LOG=installer-smoke.log") `
            -Wait `
            -PassThru

          if ($installProcess.ExitCode -ne 0) {
            Get-Content installer-smoke.log -ErrorAction SilentlyContinue
            throw "Windows installer smoke install failed with exit code $($installProcess.ExitCode)."
          }

          $launcher = Join-Path $installDir "bin\launcher.exe"
          if (-not (Test-Path $launcher)) { throw "Installed launcher.exe was not found under $installDir." }
          $readyFile = Join-Path $env:RUNNER_TEMP "subtitle-duck-smoke-ready.txt"
          Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          $env:SUBTITLE_DUCK_VERIFY_LOCAL_APP = "1"
          $env:SUBTITLE_DUCK_VERIFY_READY_FILE = $readyFile
          $app = Start-Process -FilePath $launcher -WorkingDirectory (Split-Path $launcher) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            while (-not (Test-Path $readyFile) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            if (-not (Test-Path $readyFile)) { throw "Installed app did not reach BrowserWindow creation within 45 seconds." }
            if ((Get-Content $readyFile -Raw).Trim() -ne "BrowserWindow created") { throw "Invalid app readiness signal." }
          } finally {
            taskkill /PID $app.Id /T /F 2>$null | Out-Null
            # The launcher may hand off to a detached runtime. Clean up only this installation.
            Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($installDir + "\", [System.StringComparison]::OrdinalIgnoreCase)
            } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:SUBTITLE_DUCK_VERIFY_LOCAL_APP,Env:SUBTITLE_DUCK_VERIFY_READY_FILE
          }
          $global:LASTEXITCODE = 0

      - name: Upload Windows asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Upload Windows smoke-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-duck-Windows-Smoke-Logs
          path: |
            installer-smoke.log
            ~/AppData/Local/com.subtitleduck.app/stable/logs/**
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
