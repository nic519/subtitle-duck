name: Build and release on tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify project
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Ensure the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          test "${{ github.ref_name }}" = "v$version" || {
            echo "Tag must be v$version to match package.json."
            exit 1
          }
      - run: bun test
      - run: bun run build

  build-macos:
    name: Build macOS arm64
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-duck-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-duck-windows-x64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: release-assets/*
          fail_on_unmatched_files: true
