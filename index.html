<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字幕鸭</title>
  </head>
  <body>
    <script>
      function showSubtitleDuckRendererBootError(error) {
        var root = document.getElementById("root");
        if (!root) return;
        var message =
          error && error.message
            ? error.message
            : error && error.reason
              ? String(error.reason)
              : String(error);
        root.innerHTML =
          '<div style="box-sizing:border-box;min-height:100vh;padding:24px;background:#2f2f2f;color:#fff;font:13px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;"><h1 style="margin:0 0 12px;font-size:16px;">渲染进程启动失败</h1><pre style="white-space:pre-wrap;margin:0;color:#ffb4b4;"></pre></div>';
        root.querySelector("pre").textContent = message;
      }
      window.addEventListener("error", function (event) {
        showSubtitleDuckRendererBootError(event.error || event.message || event);
      });
      window.addEventListener("unhandledrejection", function (event) {
        showSubtitleDuckRendererBootError(event.reason || event);
      });
    </script>
    <div id="root">
      <div
        style="box-sizing:border-box;min-height:100vh;padding:24px;background:#2f2f2f;color:#fff;font:13px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;"
      >
        正在加载字幕鸭...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
